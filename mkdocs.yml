site_name: Edge16 Developer Documentation
site_url: https://onliner10.github.io/Edge16/
repo_url: https://github.com/onliner10/Edge16
repo_name: onliner10/Edge16
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/EdgeTX_logo.png
  favicon: assets/images/EdgeTX_logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Release:
    - Edge16 v1.0.0-alpha.1 Features: release/features.md
    - How Edge16 differs from EdgeTX: release/edge16-vs-edgetx.md
  - Building Edge16:
    - Overview: building/index.md
    - Ubuntu 24.04: building/linux-ubuntu-24.04.md
  - Hardware Reference:
    - Radio Specifications: hardware/radio-specs.md
    - RadioMaster TX16S DMA Mapping: hardware/dma-mapping-tx16s.md
    - RadioMaster TX16S IRQ Usage: hardware/irq-usage-tx16s.md
  - Troubleshooting:
    - Unbrick Your Radio: troubleshooting/unbrick.md

exclude_docs: |
  README.md
  contributing/**
  development/**
  mods/**
  building/compilation-options.md
  building/codespaces.md
  building/linux-ubuntu-22.04.md
  building/linux-wsl.md
  building/macos-catalina.md
  building/macos-sequoia.md
  building/macos-sonoma.md
  building/qt-creator.md
  building/windows.md
  building/windows-docker.md
  hardware/dma-mapping-nv14.md

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - minify:
      minify_html: true

extra:
  version:
    provider: mike
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/onliner10/Edge16
