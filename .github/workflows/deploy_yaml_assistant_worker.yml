name: Deploy Edge16 YAML Assistant Worker

on:
  workflow_dispatch:
    inputs:
      workers_dev_subdomain:
        description: "Optional account-level workers.dev subdomain to register before deploy, e.g. onliner10-edge16"
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: tools/edge16-yaml-assistant-worker

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/edge16-yaml-assistant-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run self-test
        run: npm test

      - name: Type-check
        run: npm run check

      - name: Register workers.dev subdomain
        if: ${{ inputs.workers_dev_subdomain != '' }}
        run: |
          curl --fail-with-body --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"subdomain\":\"${{ inputs.workers_dev_subdomain }}\"}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
