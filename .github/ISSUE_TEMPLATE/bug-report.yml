name: 🐞 Bug
description: File a bug report
labels: ["bug 🪲", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Please note that this is not the place to make feature requests or ask for
        help. For this, please use [Edge16 Discussions](https://github.com/onliner10/Edge16/discussions).
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this problem?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    id: component-affected
    attributes:
      label: What part of Edge16 is the focus of this bug?
      description: Is it the radio firmware, companion software or something else?
      options:
        - Transmitter firmware
        - Companion
        - Simulator
        - Build system
        - Other (Please specify below)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current Behavior
      description: A clean and concise description of what you're experiencing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What is it that you expected to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Push throttle up.
        2. Push throttle down.
        3. Flick SWC on and off three times.
        4. See error.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Edge16 software are you running?
      options:
        - 1.0.0-alpha.1
        - Nightly (Please give date/commit below)
        - Other (Please specify below)
    validations:
      required: true
  - type: dropdown
    id: transmitter
    attributes:
      label: Transmitter
      description: |
        What transmitter are you using? You can pick more than one if this is
        affecting more than one transmitter.
      multiple: true
      options:
        - RadioMaster TX16S MK2
        - RadioMaster TX16S MK3
        - Other / unsupported radio (Please specify below)
    validations:
      required: true
  - type: dropdown
    id: os-type
    attributes:
      label: "Operating System (OS)"
      description: "If this relates to Companion or Simulator, what OSes are you are experiencing issues on?"
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: false
  - type: input
    id: os-version
    attributes:
      label: "OS Version"
      description: "If this relates to Companion or Simulator, what OS version does this relate to?"
      placeholder: "i.e. 10, Ubuntu 20.04, Big Sur"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Screenshots? References? Anything that will give us more context about the issue you are encountering!
        This includes if you are running customised firmware or have made hardware modifications to the transmitter
        which could have some bearing on the issue.

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
